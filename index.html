<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060912">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Pulso: análisis algorítmico del mercado, señales, simulaciones y alertas de precio.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulso">
  <title>Pulso · Mercados</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="bg" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/mercado" aria-label="Pulso, inicio">
      <span class="brand-mark"><img src="icons/icon-192.png" alt=""></span>
      <span class="brand-name">PULSO<small>Mercados · IA</small></span>
    </a>
    <div class="top-actions">
      <span id="conn" class="conn">…</span>
      <button class="icon-btn" data-action="open-notifs" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span id="bell-badge" class="badge" hidden>0</span>
      </button>
      <a class="icon-btn" href="#/ajustes" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
    </div>
  </header>

  <div class="ticker" aria-label="Cinta de cotizaciones"><div class="ticker-track" id="ticker"></div></div>
  <div id="mode-banner"></div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Menú principal">
    <a href="#/mercado" data-tab="mercado">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg>
      <span>Mercado</span>
    </a>
    <a href="#/ranking" data-tab="ranking">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21V10"/><path d="M16 21V4"/><path d="M12 21v-7"/><path d="M4 21v-4"/><path d="M20 21v-9"/></svg>
      <span>Ranking</span>
    </a>
    <button class="scan-btn" data-action="scan" aria-label="Analizar el mercado ahora">
      <span class="scan-ring"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="m8 12 2-2 2 2 2-3"/></svg>
    </button>
    <a href="#/siguiendo" data-tab="siguiendo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
      <span>Siguiendo</span>
    </a>
    <a href="#/noticias" data-tab="noticias">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/></svg>
      <span>Noticias</span>
    </a>
  </nav>

  <section id="sheet" class="sheet" aria-modal="true" role="dialog" aria-label="Detalle de la empresa"></section>
  <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  <div id="panel" class="panel" role="dialog" aria-label="Notificaciones"></div>
  <div id="scanfx" class="scanfx" aria-live="polite"></div>
  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script defer src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
